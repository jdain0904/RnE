controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      joints:
        - joint1
        - joint2
        - joint3
        - joint4
      interface_name: position
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity

joint_trajectory_controller:
  ros__parameters:
    gains:
      joint1: {p: 50.0, d: 5.0}
      joint2: {p: 50.0, d: 5.0}
      joint3: {p: 40.0, d: 4.0}
      joint4: {p: 30.0, d: 3.0}
